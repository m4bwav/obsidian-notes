# Runs the skill's self-test and its own markdown lint on the three operating systems it promises,
# so a change that only works on the author's machine cannot land unnoticed.
name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: self-test
        run: python skills/obsidian-notes/scripts/test_vault_lint.py
      - name: the repo's own markdown passes its lint
        run: python skills/obsidian-notes/scripts/vault_lint.py . --exclude fixtures
